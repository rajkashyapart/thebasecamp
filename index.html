  <div id="video-wrap" style="position:absolute;inset:0;overflow:hidden;">

<script>
(function() {
  var logo = document.getElementById('raj-logo');
  var cover = document.getElementById('vid-cover');
  var hl = document.getElementById('vid-headline');
  var vidWhite = document.getElementById('vid-white');
  var video = document.getElementById('vid-player');
  if (!logo || !cover || !video) return;
  video.muted = true;

  var videoRevealed = false;
  var videoEnded = false;
  var transitionStarted = false;
  var videoDuration = 0;    // learned from timeupdate data
  var revealTime = 0;       // timestamp when video was revealed
  var endTimer = null;       // precise end timer based on real duration

  // Logo fades in and breathes while video preloads
  setTimeout(function() {
    logo.classList.add('in');
    logo.classList.add('waiting');
  }, 150);

  // Absolute fallback (last-resort safety only) — same on every device so the
  // intro plays through and transitions on its real 'ended' event, like desktop.
  // Phones buffer the HLS for a few seconds before playback, so a short mobile
  // timer used to cut the video off early.
  var absoluteFallback = setTimeout(function() {
    if (!videoEnded) { videoEnded = true; doEndTransition(); }
  }, 15000);

  // Schedule end based on real video duration + current playback position
  function scheduleEnd(currentTime, duration) {
    if (videoEnded || !videoRevealed) return;
    clearTimeout(endTimer);
    var remaining = (duration - currentTime) * 1000;
    if (remaining < 50) remaining = 50;
    endTimer = setTimeout(function() {
      if (!videoEnded) { videoEnded = true; doEndTransition(); }
    }, remaining);
  }

  // Reveal video: logo out -> cover dissolves -> headline in
  function revealVideo() {
    if (videoRevealed) return;
    videoRevealed = true;
    revealTime = Date.now();
    logo.classList.remove('waiting');
    logo.classList.remove('in');
    logo.classList.add('out');
    setTimeout(function() { cover.classList.add('fade'); }, 350);
    setTimeout(function() { if (hl) hl.classList.add('show'); }, 650);
    // If we already know the duration, schedule end now
    if (videoDuration > 0) {
      scheduleEnd(0, videoDuration);
    }
    // No premature safety net here — let the video play to its real 'ended'
    // event (or the 15s absolute fallback). A short net was cutting the intro
    // off on phones that buffer for a few seconds before playback.
  }

  // Retry playback on first user interaction (mobile autoplay policy)
  function onPlayFail() {
    function retry() {
      document.removeEventListener('touchstart', retry);
      document.removeEventListener('click', retry);
      video.play().catch(function() {});
    }
    document.addEventListener('touchstart', retry, { once: true });
    document.addEventListener('click', retry, { once: true });
  }

  // HLS setup — native <video> for reliable mobile autoplay
  var hlsSrc = 'https://vz-6f9a60bb-593.b-cdn.net/8033cbca-5209-4e8f-b446-89f668359e16/playlist.m3u8';

  function attachVideoEvents() {
    video.addEventListener('playing', function() {
      revealVideo();
    });
    video.addEventListener('timeupdate', function() {
      if (video.duration > 0) {
        videoDuration = video.duration;
        scheduleEnd(video.currentTime, video.duration);
      }
    });
    video.addEventListener('ended', function() {
      if (!videoEnded) {
        videoEnded = true;
        clearTimeout(absoluteFallback);
        clearTimeout(endTimer);
        doEndTransition();
      }
    });
  }

  attachVideoEvents();

  if (video.canPlayType('application/vnd.apple.mpegurl')) {
    // Safari: native HLS support
    video.src = hlsSrc;
    video.play().catch(onPlayFail);
  } else if (typeof Hls !== 'undefined' && Hls.isSupported()) {
    // Chrome, Firefox, etc: use HLS.js
    var hls = new Hls({ enableWorker: true, startLevel: -1 });
    hls.loadSource(hlsSrc);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function() {
      video.play().catch(onPlayFail);
    });
  } else {
    // No HLS support at all — skip to playground
    doEndTransition();
  }

  // Cross-dissolve to warm bg, then navigate to playground
  var textOverlay = document.getElementById('vid-text-overlay');
  function doEndTransition() {
    if (transitionStarted) return;
    transitionStarted = true;
    clearTimeout(absoluteFallback);
    clearTimeout(endTimer);
    // Warm bg washes in behind the headline
    if (vidWhite) { vidWhite.classList.add('flash'); }
    // Headline stays visible — shifts white->black, overlay bg clears
    if (textOverlay) textOverlay.classList.add('clear');
    if (hl) hl.classList.add('dark');
    // Navigate after color shift completes so view-transition morphs black->black
    setTimeout(function() {
      window.location.href = 'playground.html';
    }, 600);
  }
})();

/* Playground */
var WCX = 1800, WCY = 1400;
</script>
